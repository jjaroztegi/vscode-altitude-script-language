name: Publish VS Code Extension

# Publishes one VSIX to the Visual Studio Marketplace (Azure OIDC) and
# Open VSX (trusted publishing). Neither uses a long-lived token.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to Visual Studio Marketplace and Open VSX
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and bundle
        run: npm run package

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npx vsce package --out extension.vsix

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Visual Studio Marketplace
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npx vsce publish --packagePath extension.vsix --azure-credential --skip-duplicate

      - name: Publish to Open VSX
        run: npx ovsx publish extension.vsix --trusted-publishing --skip-duplicate
