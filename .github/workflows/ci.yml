name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and bundle
        run: npm run package

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npx vsce package --out altitude-asl.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: altitude-asl.vsix
